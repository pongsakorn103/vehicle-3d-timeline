<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Vehicle Timeline Visualizer</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.85);
            --panel-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #06b6d4;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #0f172a;
        }

        /* Overlay Layout */
        .app-header {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .app-title {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Pre-upload Notice Overlay */
        .instruction-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 999;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 30px 40px;
            text-align: center;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .instruction-banner.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -45%);
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 10px;
            padding-left: 10px;
            border-left: 1px solid var(--panel-border);
        }

        .color-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }

        .color-dot:hover, .color-dot.active {
            transform: scale(1.2);
            border-color: #fff;
        }

        /* Control Panel */
        .controls-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 800px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid var(--panel-border);
            padding: 16px 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: opacity 0.3s;
        }

        .controls-panel.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .timeline-slider {
            width: 100%;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        .timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent);
        }

        .playback-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .play-btns {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-select {
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            padding: 6px 10px;
            border-radius: 6px;
            outline: none;
            font-size: 0.85rem;
        }

        /* Sidebar Log */
        .sidebar {
            position: absolute;
            top: 80px;
            right: 15px;
            bottom: 120px;
            width: 320px;
            z-index: 1000;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .sidebar.collapsed {
            transform: translateX(350px);
        }

        .log-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .log-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .log-item:hover, .log-item.active {
            border-color: var(--accent);
            background: rgba(6, 182, 212, 0.15);
        }

        .log-item .time {
            color: var(--accent);
            font-weight: 600;
        }

        .log-item .location {
            color: var(--text-main);
            margin-top: 2px;
        }

        #file-input {
            display: none;
        }
    </style>

    <!-- External Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

    <div id="map"></div>

    <!-- Header Controls -->
    <div class="app-header">
        <div class="app-title">
            <i class="fa-solid fa-route" style="color: var(--accent);"></i>
            <span>3D Timeline Track</span>
        </div>
        
        <button class="btn" onclick="triggerFileInput()">
            <i class="fa-solid fa-file-excel"></i> อัปโหลดไฟล์ Excel
        </button>
        <input type="file" id="file-input" accept=".xlsx, .xls, .csv" onchange="handleFileUpload(event)">

        <button class="btn btn-outline" onclick="loadSampleData()">
            <i class="fa-solid fa-database"></i> ใช้ข้อมูลตัวอย่าง
        </button>

        <!-- Color Picker -->
        <div class="color-picker-wrapper">
            <span style="font-size: 0.75rem; color: var(--text-sub);">สีรถ:</span>
            <div class="color-dot active" style="background: #ffffff;" onclick="setCarColor(0xffffff, this)" title="สีขาว"></div>
            <div class="color-dot" style="background: #111111;" onclick="setCarColor(0x111111, this)" title="สีดำ"></div>
            <div class="color-dot" style="background: #94a3b8;" onclick="setCarColor(0x94a3b8, this)" title="สีเทา"></div>
            <div class="color-dot" style="background: #ef4444;" onclick="setCarColor(0xef4444, this)" title="สีแดง"></div>
            <div class="color-dot" style="background: #3b82f6;" onclick="setCarColor(0x3b82f6, this)" title="สีน้ำเงิน"></div>
        </div>
    </div>

    <!-- Pre-upload Banner -->
    <div class="instruction-banner" id="banner">
        <i class="fa-solid fa-car-side" style="font-size: 3rem; color: var(--accent); margin-bottom: 15px;"></i>
        <h2 style="margin-bottom: 10px; font-weight: 600;">3D Vehicle Timeline</h2>
        <p style="color: var(--text-sub); font-size: 0.9rem; margin-bottom: 20px;">
            อัปโหลดไฟล์ข้อมูลทะเบียนรถ หรือกดปุ่มข้อมูลตัวอย่างเพื่อแสดงเส้นทางแอนิเมชัน 3D
        </p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="btn" onclick="triggerFileInput()">
                <i class="fa-solid fa-upload"></i> อัปโหลดไฟล์
            </button>
            <button class="btn btn-outline" onclick="loadSampleData()">
                ลองใช้ข้อมูลตัวอย่าง
            </button>
        </div>
    </div>

    <!-- Controls Panel -->
    <div class="controls-panel disabled" id="controls-panel">
        <input type="range" id="timeline" class="timeline-slider" min="0" max="100" value="0" step="0.1" oninput="onSeek(this.value)">
        
        <div class="playback-row">
            <div class="play-btns">
                <button class="btn btn-outline" onclick="togglePlay()" id="play-btn">
                    <i class="fa-solid fa-play"></i> เล่น
                </button>
                <button class="btn btn-outline" onclick="resetAnimation()">
                    <i class="fa-solid fa-rotate-left"></i> รีเซ็ต
                </button>
                <span id="time-display" style="font-size: 0.85rem; color: var(--accent); margin-left: 10px;">--:--:--</span>
            </div>

            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 0.8rem; color: var(--text-sub);">ความเร็ว (Slow-Mo):</span>
                <select class="speed-select" id="speed-select" onchange="changeSpeed(this.value)">
                    <option value="0.25">0.25x (ช้ามาก)</option>
                    <option value="0.5">0.5x (Slow-Motion)</option>
                    <option value="1" selected>1.0x (ปกติ)</option>
                    <option value="2">2.0x (เร็ว)</option>
                    <option value="5">5.0x (เร่งด่วน)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Sidebar Log -->
    <div class="sidebar collapsed" id="sidebar">
        <div style="display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 0.9rem;">
            <span><i class="fa-solid fa-list-check" style="color: var(--accent);"></i> ประวัติผ่านจุดตรวจ</span>
            <span id="total-count" style="font-size: 0.75rem; color: var(--text-sub);">0 จุด</span>
        </div>
        <div class="log-list" id="log-list"></div>
    </div>

    <script>
        var map = null;
        var car3DGroup = null;
        var carBodyMesh = null;
        var routeData = [];
        var isPlaying = false;
        var currentIndex = 0;
        var animProgress = 0;
        var speed = 1.0;
        var animFrameId = null;
        var currentCarColor = 0xffffff;
        var pathPolyline = null;
        var carMarker = null;

        var sampleExcelData = [
            { "ลำดับ": 77, "DATE - TIME": "2026/10/22 - 13:27:06", "รายละเอียดรถ": "4ขฌ 2080 กรุงเทพมหานคร", "ลำดับ - จุดติดตั้งกล้อง": "77 - ทับช้าง 2_EX08", "LATITUDE": 13.773427, "LONGITUDE": 100.689188 },
            { "ลำดับ": 76, "DATE - TIME": "2026/10/22 - 14:47:11", "รายละเอียดรถ": "4ขฌ 2080 กรุงเทพมหานคร", "ลำดับ - จุดติดตั้งกล้อง": "76 - บางปะอิน_ขาออก", "LATITUDE": 14.270696, "LONGITUDE": 100.613202 },
            { "ลำดับ": 75, "DATE - TIME": "2026/10/22 - 15:43:15", "รายละเอียดรถ": "4ขฌ 2080 กรุงเทพมหานคร", "ลำดับ - จุดติดตั้งกล้อง": "75 - แยกปากบางบางงา_ออก", "LATITUDE": 14.848605, "LONGITUDE": 100.444330 },
            { "ลำดับ": 74, "DATE - TIME": "2026/10/22 - 16:07:17", "รายละเอียดรถ": "4ขฌ 2080 กรุงเทพมหานคร", "ลำดับ - จุดติดตั้งกล้อง": "74 - สรรพยา_ขาออก", "LATITUDE": 15.117418, "LONGITUDE": 100.274551 },
            { "ลำดับ": 73, "DATE - TIME": "2026/10/22 - 17:29:46", "รายละเอียดรถ": "4ขฌ 2080 กรุงเทพมหานคร", "ลำดับ - จุดติดตั้งกล้อง": "73 - เนินขี้เหล็ก_ขาออก", "LATITUDE": 15.849384, "LONGITUDE": 99.923986 },
            { "ลำดับ": 72, "DATE - TIME": "2026/10/22 - 19:10:01", "รายละเอียดรถ": "4ขฌ 2080 กรุงเทพมหานคร", "ลำดับ - จุดติดตั้งกล้อง": "72 - โกสัมพี_ขาออก", "LATITUDE": 16.655577, "LONGITUDE": 99.318526 },
            { "ลำดับ": 71, "DATE - TIME": "2026/10/22 - 19:31:37", "รายละเอียดรถ": "4ขฌ 2080 กรุงเทพมหานคร", "ลำดับ - จุดติดตั้งกล้อง": "71 - แยกแม่สอด_ขาขึ้น", "LATITUDE": 16.841332, "LONGITUDE": 99.113800 }
        ];

        function initMap() {
            map = L.map('map', {
                center: [13.7563, 100.5018],
                zoom: 6,
                zoomControl: false
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            L.control.zoom({ position: 'bottomright' }).addTo(map);
        }

        function create3DCar() {
            var container = document.createElement('div');
            container.style.width = '60px';
            container.style.height = '60px';

            var scene = new THREE.Scene();
            var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
            camera.position.set(0, 10, 15);
            camera.lookAt(0, 0, 0);

            var renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(60, 60);
            container.appendChild(renderer.domElement);

            var ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            var dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            car3DGroup = new THREE.Group();

            var bodyGeo = new THREE.BoxGeometry(2.2, 0.8, 4.2);
            var bodyMat = new THREE.MeshStandardMaterial({ 
                color: currentCarColor, 
                metalness: 0.6, 
                roughness: 0.2 
            });
            carBodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            carBodyMesh.position.y = 0.6;
            car3DGroup.add(carBodyMesh);

            var cabinGeo = new THREE.BoxGeometry(1.8, 0.6, 2.2);
            var cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
            var cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1.2, -0.2);
            car3DGroup.add(cabin);

            scene.add(car3DGroup);

            function animate3D() {
                requestAnimationFrame(animate3D);
                renderer.render(scene, camera);
            }
            animate3D();

            return L.divIcon({
                html: container,
                className: '',
                iconSize: [60, 60],
                iconAnchor: [30, 30]
            });
        }

        function setCarColor(hexColor, el) {
            currentCarColor = hexColor;
            if (carBodyMesh) {
                carBodyMesh.material.color.setHex(hexColor);
            }
            var dots = document.querySelectorAll('.color-dot');
            dots.forEach(function(d) { d.classList.remove('active'); });
            if (el) el.classList.add('active');
        }

        function processRouteData(data) {
            if (!data || !data.length) return;

            routeData = data.sort(function(a, b) {
                return new Date(a["DATE - TIME"]) - new Date(b["DATE - TIME"]);
            });

            document.getElementById('banner').classList.add('hidden');
            document.getElementById('controls-panel').classList.remove('disabled');
            document.getElementById('sidebar').classList.remove('collapsed');

            if (pathPolyline) map.removeLayer(pathPolyline);
            if (carMarker) map.removeLayer(carMarker);

            var latLngs = routeData.map(function(d) { 
                return [parseFloat(d.LATITUDE), parseFloat(d.LONGITUDE)]; 
            });

            pathPolyline = L.polyline(latLngs, {
                color: '#06b6d4',
                weight: 4,
                opacity: 0.8,
                dashArray: '8, 8'
            }).addTo(map);

            map.fitBounds(pathPolyline.getBounds(), { padding: [50, 50] });

            carMarker = L.marker(latLngs[0], { icon: create3DCar() }).addTo(map);

            var logList = document.getElementById('log-list');
            logList.innerHTML = '';
            document.getElementById('total-count').innerText = routeData.length + " จุด";

            routeData.forEach(function(item, idx) {
                var div = document.createElement('div');
                div.className = "log-item " + (idx === 0 ? "active" : "");
                div.onclick = function() { jumpToIndex(idx); };
                div.innerHTML = '<div class="time"><i class="fa-regular fa-clock"></i> ' + (item["DATE - TIME"] || '') + '</div>' +
                                '<div class="location"><i class="fa-solid fa-camera"></i> ' + (item["ลำดับ - จุดติดตั้งกล้อง"] || item["จุดติดตั้งกล้อง"] || 'จุดตรวจ') + '</div>';
                logList.appendChild(div);
            });

            currentIndex = 0;
            animProgress = 0;
            updateUI();
        }

        function triggerFileInput() {
            document.getElementById('file-input').click();
        }

        function handleFileUpload(e) {
            var file = e.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    var data = new Uint8Array(evt.target.result);
                    var workbook = XLSX.read(data, { type: 'array' });
                    var firstSheetName = workbook.SheetNames[0];
                    var firstSheet = workbook.Sheets[firstSheetName];
                    var jsonData = XLSX.utils.sheet_to_json(firstSheet);
                    processRouteData(jsonData);
                } catch(err) {
                    alert("ไม่สามารถอ่านไฟล์ได้ กรุณาตรวจสอบรูปแบบไฟล์ Excel/CSV");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function loadSampleData() {
            processRouteData(sampleExcelData);
        }

        function updateAnimation() {
            if (!isPlaying || routeData.length < 2) return;

            animProgress += 0.005 * speed;

            if (animProgress >= 1) {
                animProgress = 0;
                currentIndex++;
                if (currentIndex >= routeData.length - 1) {
                    currentIndex = routeData.length - 2;
                    isPlaying = false;
                    document.getElementById('play-btn').innerHTML = '<i class="fa-solid fa-play"></i> เล่น';
                    return;
                }
            }

            var p1 = routeData[currentIndex];
            var p2 = routeData[currentIndex + 1];

            var currentLat = parseFloat(p1.LATITUDE) + (parseFloat(p2.LATITUDE) - parseFloat(p1.LATITUDE)) * animProgress;
            var currentLng = parseFloat(p1.LONGITUDE) + (parseFloat(p2.LONGITUDE) - parseFloat(p1.LONGITUDE)) * animProgress;

            carMarker.setLatLng([currentLat, currentLng]);

            var angle = Math.atan2(parseFloat(p2.LONGITUDE) - parseFloat(p1.LONGITUDE), parseFloat(p2.LATITUDE) - parseFloat(p1.LATITUDE)) * (180 / Math.PI);
            if (car3DGroup) {
                car3DGroup.rotation.y = angle * (Math.PI / 180);
            }

            updateUI();
            animFrameId = requestAnimationFrame(updateAnimation);
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            var btn = document.getElementById('play-btn');
            if (isPlaying) {
                btn.innerHTML = '<i class="fa-solid fa-pause"></i> หยุด';
                updateAnimation();
            } else {
                btn.innerHTML = '<i class="fa-solid fa-play"></i> เล่น';
                cancelAnimationFrame(animFrameId);
            }
        }

        function resetAnimation() {
            isPlaying = false;
            currentIndex = 0;
            animProgress = 0;
            document.getElementById('play-btn').innerHTML = '<i class="fa-solid fa-play"></i> เล่น';
            if (routeData.length > 0) {
                carMarker.setLatLng([parseFloat(routeData[0].LATITUDE), parseFloat(routeData[0].LONGITUDE)]);
            }
            updateUI();
        }

        function changeSpeed(val) {
            speed = parseFloat(val);
        }

        function onSeek(val) {
            var total = routeData.length - 1;
            var target = (val / 100) * total;
            currentIndex = Math.floor(target);
            animProgress = target - currentIndex;
            
            if (currentIndex >= total) {
                currentIndex = total - 1;
                animProgress = 1;
            }

            var p1 = routeData[currentIndex];
            var p2 = routeData[currentIndex + 1] || p1;

            var currentLat = parseFloat(p1.LATITUDE) + (parseFloat(p2.LATITUDE) - parseFloat(p1.LATITUDE)) * animProgress;
            var currentLng = parseFloat(p1.LONGITUDE) + (parseFloat(p2.LONGITUDE) - parseFloat(p1.LONGITUDE)) * animProgress;

            carMarker.setLatLng([currentLat, currentLng]);
            updateUI();
        }

        function jumpToIndex(idx) {
            currentIndex = idx;
            animProgress = 0;
            var target = routeData[idx];
            carMarker.setLatLng([parseFloat(target.LATITUDE), parseFloat(target.LONGITUDE)]);
            map.panTo([parseFloat(target.LATITUDE), parseFloat(target.LONGITUDE)]);
            updateUI();
        }

        function updateUI() {
            if (!routeData.length) return;
            var total = routeData.length - 1;
            var currentTotal = currentIndex + animProgress;
            var progressPct = (currentTotal / total) * 100;
            
            document.getElementById('timeline').value = progressPct;
            document.getElementById('time-display').innerText = routeData[currentIndex]["DATE - TIME"] || '--:--:--';

            var items = document.querySelectorAll('.log-item');
            items.forEach(function(item, i) {
                if (i === currentIndex) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        window.onload = initMap;
    </script>
</body>
</html>
